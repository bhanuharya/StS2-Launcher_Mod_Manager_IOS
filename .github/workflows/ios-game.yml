name: iOS game build

# Builds StS2.ipa from your own copy of Slay the Spire 2 on a GitHub macOS
# runner: game files from Steam, patched and compiled ahead of time for iOS.
# See ios/README.md.
#
# Actions > "iOS game build" > Run workflow, source = steam:
#   logs into Steam as STEAM_USERNAME with STEAM_PASSWORD and a Steam Guard
#   code: the run opens an issue that @mentions you, and you reply with the
#   code from the Steam app. (Steam blocks approving the sign-in in the app,
#   because GitHub's runners are far from you.) With a STEAM_REFRESH_TOKEN
#   secret from `SteamFetch login` (ios/tools/SteamFetch) it needs neither.
#   The .ipa holds compiled game code and this repo is public, so it is only
#   uploaded inside a zip encrypted with the IPA_PASSWORD secret.
#
# Pushes to ios/** run source = fake: the same pipeline on the stand-in game
# in ios/test, with no secrets and no game files, to catch breakage early.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "steam = your game via Steam login, fake = pipeline self-test"
        type: choice
        options: [steam, fake]
        default: steam
      steam_branch:
        description: "Steam branch to download (public, public-beta, ...)"
        default: public
      repack_astc:
        description: "Convert the pck's BC textures to ASTC (faster loads, ~4x less texture VRAM)"
        type: boolean
        default: true
      astc_quality:
        description: "ASTC encode effort (fast keeps the build short)"
        type: choice
        options: [fast, medium, thorough]
        default: fast
  push:
    paths:
      - "ios/**"
      - "!ios/probe/**"
      - "!ios/README.md"
      - "!ios/tools/SteamFetch/**"
      - "src/stubs/**"
      - ".github/workflows/ios-game.yml"

permissions:
  contents: read
  # Steam Guard code requests (ios/tools/steam_guard_code.py).
  issues: write
  # Records the built Steam build in the IOS_LAST_BUILDID variable, which
  # the iOS update watch compares against (ios-update-watch.yml).
  actions: write

concurrency:
  group: ios-game-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  GODOT_BASE_URL: https://github.com/godotengine/godot/releases/download/4.5.1-stable
  STS2_APP_ID: "2868840"
  SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'fake' }}
  # Push runs (fake game) get the default true, so the conversion self-test
  # runs on every ios/** change.
  REPACK_ASTC: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.repack_astc }}
  REPACK_QUALITY: ${{ inputs.astc_quality || 'fast' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check secrets
        if: env.SOURCE == 'steam'
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          missing=""
          [ -n "$STEAM_USERNAME" ] || missing="$missing STEAM_USERNAME"
          [ -n "$STEAM_REFRESH_TOKEN$STEAM_PASSWORD" ] || missing="$missing STEAM_PASSWORD"
          [ -n "$IPA_PASSWORD" ] || missing="$missing IPA_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # First, so the Steam Guard code request comes right after you start the run.
      - name: Download game from Steam
        id: steam
        if: env.SOURCE == 'steam'
        timeout-minutes: 30
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_BRANCH: ${{ inputs.steam_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          GUARD_USER: ${{ github.triggering_actor }}
        run: |
          # Only what the build needs: the assemblies, the pck (for its project
          # settings; it is not uploaded), and release_info.json.
          printf '%s\n' 'regex:^data_[^/]+/[^/]+\.dll$' 'regex:^[^/]+\.pck$' 'release_info.json' > "$RUNNER_TEMP/files.txt"
          dotnet build ios/tools/SteamFetch -c Release -o "$RUNNER_TEMP/steamfetch" -v quiet -nologo
          # Without a saved login, Steam asks for a Steam Guard code, which
          # steam_guard_code.py gets from you through an issue.
          dotnet "$RUNNER_TEMP/steamfetch/SteamFetch.dll" download \
            --user "$STEAM_USERNAME" --app "$STS2_APP_ID" --branch "${STEAM_BRANCH:-public}" \
            --filelist "$RUNNER_TEMP/files.txt" --dir "$HOME/game" \
            --code-command "$PWD/ios/tools/steam_guard_code.py" < /dev/null
          ls -la "$HOME/game"
          if [ ! -f "$HOME/game/SlayTheSpire2.pck" ]; then
            echo "::error::SlayTheSpire2.pck was not downloaded (wrong branch, or the account doesn't own the game?)"
            exit 1
          fi
          # The Steam build this run is for, so the update watch (and the
          # IOS_LAST_BUILDID recording below) know it.
          dotnet "$RUNNER_TEMP/steamfetch/SteamFetch.dll" appinfo \
            --app "$STS2_APP_ID" --branch "${STEAM_BRANCH:-public}" > "$RUNNER_TEMP/appinfo.txt" || true
          cat "$RUNNER_TEMP/appinfo.txt"
          bid="$(sed -n 's/^buildid=//p' "$RUNNER_TEMP/appinfo.txt" | head -1)"
          if [ -n "$bid" ]; then
            echo "STEAM_BUILDID=$bid" >> "$GITHUB_ENV"
          fi

      - name: Close the Steam Guard issue
        if: always() && env.SOURCE == 'steam'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.steam.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then note="Signed in and downloaded. The build continues."; else note="The Steam step failed; see the run log."; fi
          ios/tools/steam_guard_code.py --close "$note"

      - name: Cache Godot editor + iOS template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-mono-macos-ios-v1

      - name: Download Godot editor + iOS template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache && cd ~/godot-cache
          curl -fsSL -o editor.zip "$GODOT_BASE_URL/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          unzip -q editor.zip && rm editor.zip
          curl -fsSL -o templates.tpz "$GODOT_BASE_URL/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q templates.tpz templates/ios.zip templates/version.txt && rm templates.tpz

      - name: Install Godot
        run: |
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$TPL_DIR"
          cp ~/godot-cache/templates/* "$TPL_DIR/"
          echo "GODOT=$HOME/godot-cache/Godot_mono.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Cache FMOD/Spine downloads
        uses: actions/cache@v4
        with:
          path: ~/ext-cache
          key: gdext-fmod-6.1.0-4.5.0-spine-4.2-4.5.1-v1

      - name: Build the fake game
        if: env.SOURCE == 'fake'
        run: ios/scripts/make-fake-game.sh "$HOME/game"

      # Tools for the BC -> ASTC texture conversion in prepare-game.sh
      # (REPACK_ASTC). The fake game has no textures, so on push runs this
      # only exercises the conversion self-test.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install texture conversion tools
        run: pip3 install texture2ddecoder

      - name: Cache astcenc
        uses: actions/cache@v4
        with:
          path: ~/astcenc-bin
          key: astcenc-5.7.0-macos-universal

      - name: Install astcenc
        run: |
          if [ ! -x "$HOME/astcenc-bin/astcenc" ]; then
            mkdir -p "$HOME/astcenc-bin"
            curl -fsSL -o /tmp/astcenc.zip \
              https://github.com/ARM-software/astc-encoder/releases/download/5.7.0/astcenc-5.7.0-macos-universal.zip
            unzip -o -q /tmp/astcenc.zip -d /tmp/astcenc
            cp /tmp/astcenc/bin/astcenc "$HOME/astcenc-bin/astcenc"
            chmod +x "$HOME/astcenc-bin/astcenc"
          fi
          echo "$HOME/astcenc-bin" >> "$GITHUB_PATH"

      - name: Build StS2.ipa
        run: EXT_CACHE="$HOME/ext-cache" ios/scripts/build-game-ios.sh "$HOME/game" build/game

      - name: Encrypt IPA
        if: env.SOURCE == 'steam'
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          command -v 7z >/dev/null || brew install p7zip
          source build/game/work/game.env
          NAME="StS2-ios-${GAME_VERSION}-run${GITHUB_RUN_NUMBER}"
          mkdir -p upload
          # -mx=1: both payloads are already compressed; this zip is for
          # encryption, not compression.
          7z a -tzip -mem=AES256 -mx=1 -p"$IPA_PASSWORD" "upload/$NAME.zip" ./build/game/StS2.ipa > /dev/null
          rm -f build/game/StS2.ipa
          if [ "$REPACK_ASTC" = "true" ]; then
            # The converted pck goes with the app: ios_boot size-checks it
            # against this build, so copy this one, not the PC's file.
            7z a -tzip -mem=AES256 -mx=1 -p"$IPA_PASSWORD" "upload/$NAME.zip" "$HOME/game/SlayTheSpire2.pck" > /dev/null
            echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_ENV"
            echo "### StS2.ipa built for game ${GAME_VERSION}" >> "$GITHUB_STEP_SUMMARY"
            echo "Copy **SlayTheSpire2.pck from this zip** (BC textures already converted to ASTC) into the app's folder." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_ENV"
            echo "### StS2.ipa built for game ${GAME_VERSION}" >> "$GITHUB_STEP_SUMMARY"
            echo "Copy SlayTheSpire2.pck from your Steam install (${PCK_SIZE} bytes) into the app's folder." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage fake-game IPA
        if: env.SOURCE == 'fake'
        run: |
          mkdir -p upload
          cp build/game/StS2.ipa upload/StS2-fakegame.ipa
          cp "$HOME/game/SlayTheSpire2.pck" upload/
          echo "ARTIFACT_NAME=StS2-fakegame-run${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: upload/
          if-no-files-found: error
          retention-days: 3

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StS2-build-logs-run${{ github.run_number }}
          path: build/game/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Record the built Steam build
        # Only on success, so a failed build is retried by the watch the
        # next day. Stored as "branch:buildid"; the watch compares the
        # public branch's buildid.
        if: env.SOURCE == 'steam'
        env:
          GH_TOKEN: ${{ github.token }}
          STEAM_BRANCH: ${{ inputs.steam_branch || 'public' }}
        run: |
          [ -n "$STEAM_BUILDID" ] || { echo "no STEAM_BUILDID captured; not recording"; exit 0; }
          value="${STEAM_BRANCH:-public}:$STEAM_BUILDID"
          if gh api "repos/$GITHUB_REPOSITORY/actions/variables/IOS_LAST_BUILDID" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/actions/variables/IOS_LAST_BUILDID" -f value="$value" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/variables" -f name=IOS_LAST_BUILDID -f value="$value" >/dev/null
          fi
          echo "recorded $value in IOS_LAST_BUILDID"

      - name: Remove game files
        if: always()
        run: rm -rf "$HOME/game" build upload
